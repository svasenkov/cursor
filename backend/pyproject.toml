[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Backend API for the course management system"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.23"
pydantic = "^2.4.2"
alembic = "^1.12.1"
fastapi-cache2 = "^0.2.1"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.0.3"
asyncpg = "^0.29.0"
sqlalchemy-utils = "^0.41.1"
aiosqlite = "^0.19.0"
greenlet = "^3.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
httpx = "^0.25.1"
faker = "^19.12.0"
pytest-asyncio = "^0.21.1"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = [
    "health: marks tests related to health check endpoint",
    "courses: marks tests related to course CRUD operations",
    "statistics: marks tests related to statistics endpoints"
] 
